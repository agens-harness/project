.value { font-size:8.5px; font-weight:700; fill:#12996a; text-anchor:middle;
  stroke:#fff; stroke-width:2.4px; paint-order:stroke; stroke-linejoin:round; }
.step-label { font-family:Palatino Linotype,Book Antiqua,Palatino,Georgia,serif; font-size:9px; font-weight:700;
  fill:#000; text-anchor:middle; }
.title { font-size:10.5px; font-weight:700; fill:#000; text-anchor:end; }
.draw { stroke-dasharray:1; animation:draw 0.6s ease-out both; }
.pop { transform-box:fill-box; transform-origin:center; animation:pop .45s cubic-bezier(.3,1.6,.5,1) both; }
.rise { transform-box:fill-box; transform-origin:bottom; animation:rise .5s ease-out both; }
.fade { animation:fade .5s ease-out both; }
@keyframes draw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
@keyframes pop { from { transform:scale(0); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes rise { from { transform:scaleY(0); } to { transform:scaleY(1); } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }

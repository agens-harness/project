<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561.6 223.2" width="561.6" height="223.2" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Pandoc test-pass rates by model and number of agents</title>
<desc id="figure-description">GPT-5.6-sol (high) achieves 33.89%, 41.75%, 43.11%, 50.94%, and 55.06% with 1, 8, 32, 128, and 1,024 agents. Peer coordination, multi-worker integration, standardized workflows, and specialized roles emerge as the organization grows. GPT-6.1-sol (high) achieves 56.19%, 71.38%, and 79.59% with 1, 8, and 32 agents. The original results and cooperation steps appear first, followed by the new purple series and finally the model legend.</desc>
<style>
text { font-family:Helvetica Neue,Helvetica,Arial,sans-serif; }
.tick { font-size:8px; fill:#52514e; text-anchor:middle; }
.axis { font-size:8.5px; fill:#52514e; text-anchor:middle; }
.value { font-size:8.5px; font-weight:700; fill:#12996a; text-anchor:middle;
  stroke:#fff; stroke-width:2.4px; paint-order:stroke; stroke-linejoin:round; }
.value.latest { fill:#8b5cff; }
.step-label { font-family:Palatino Linotype,Book Antiqua,Palatino,Georgia,serif; font-size:9px; font-weight:700;
  fill:#000; text-anchor:middle; }
.title { font-size:10.5px; font-weight:700; fill:#000; text-anchor:end; }
.legend-label { font-size:7.5px; fill:#52514e; }
.draw { stroke-dasharray:1; animation:draw 0.6s ease-out both; }
.pop { transform-box:fill-box; transform-origin:center; animation:pop .45s cubic-bezier(.3,1.6,.5,1) both; }
.rise { transform-box:fill-box; transform-origin:bottom; animation:rise .5s ease-out both; }
.fade { animation:fade .5s ease-out both; }
@keyframes draw { from { stroke-dashoffset:1; } to { stroke-dashoffset:0; } }
@keyframes pop { from { transform:scale(0); opacity:0; } to { transform:scale(1); opacity:1; } }
@keyframes rise { from { transform:scaleY(0); } to { transform:scaleY(1); } }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 561.6 223.2" width="561.6" height="223.2" role="img" aria-label="Final test-pass rate on pandoc rising from 33.89% with 1 agent to 55.06% with 1,024 agents, with emergent self-organized cooperation growing as a staircase">
<style>
text { font-family:Helvetica Neue,Helvetica,Arial,sans-serif; }
